name: Validate consolidated repository
on: [push, pull_request]
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r dataset_v2/requirements.txt
      - run: python -m compileall -q dataset_v2/pipeline tools tests
      - run: python tools/consolidate_history.py verify
      - name: Reproduce historical corpus measurements from bundle
        run: |
          python tools/consolidate_history.py reconcile --output "$RUNNER_TEMP/historical-union"
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = json.loads(Path('historical_corpus/summary.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'historical-union/summary.json').read_text())
          # gzip bytes may differ across zlib versions; compare content measurements.
          for key in ('input_document_occurrences', 'unique_documents',
                      'exact_repeated_occurrences', 'historical_splits', 'corpus_file_revisions'):
              assert actual[key] == expected[key], (key, actual[key], expected[key])
          PY
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s dataset_v2/tests -v
      - run: python dataset_v2/pipeline/check_requirements.py --profiles A
      - name: Synthetic integration test in disposable copy
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp -R dataset_v2 "$RUNNER_TEMP/smoke/dataset_v2"
          python "$RUNNER_TEMP/smoke/dataset_v2/tests/run_smoke_test.py"
