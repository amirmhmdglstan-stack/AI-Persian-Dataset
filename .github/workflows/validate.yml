name: Validate consolidated repository
on: [push, pull_request]
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r dataset_v2/requirements.txt
      - run: python -m compileall -q dataset_v2/pipeline tools tests
      - run: python tools/consolidate_history.py verify
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s dataset_v2/tests -v
      - run: python dataset_v2/pipeline/check_requirements.py --profiles A
      - name: Synthetic integration test in disposable copy
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp -R dataset_v2 "$RUNNER_TEMP/smoke/dataset_v2"
          python "$RUNNER_TEMP/smoke/dataset_v2/tests/run_smoke_test.py"
